name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pubspec
        id: pubspec
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml — skipping Flutter CI (standards-only branch)."
          fi

      - name: Read FVM flutter version
        if: steps.pubspec.outputs.present == 'true'
        id: fvm
        shell: bash
        run: |
          if [ -f .fvmrc ]; then
            echo "version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "version=3.24.1" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.pubspec.outputs.present == 'true'
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.pubspec.outputs.present == 'true'
        run: flutter pub get

      - name: Flutter analyze
        if: steps.pubspec.outputs.present == 'true'
        run: flutter analyze

      - name: Unit tests
        if: steps.pubspec.outputs.present == 'true'
        run: flutter test