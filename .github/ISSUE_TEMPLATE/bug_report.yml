name: Bug Report
description: Report a defect in a platform repository
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Support
        - Notification
        - Voucher
        - AML
        - Insurance
        - Payment
        - Office Assistance
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch, deployment target, browser/app version if relevant
