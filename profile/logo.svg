<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MITF Dev Space">
  <defs>
    <linearGradient id="ring" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mark" x1="88" y1="72" x2="168" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Outer ring (symmetric) -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.95"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.55"/>

  <!-- Symmetric code brackets -->
  <path d="M 74 78 L 54 128 L 74 178" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 182 78 L 202 128 L 182 178" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered M monogram (perfectly symmetric) -->
  <path
    d="M 98 176 L 98 92 L 128 136 L 158 92 L 158 176"
    fill="none"
    stroke="url(#mark)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Symmetric accent dashes (left / right) -->
  <line x1="108" y1="196" x2="118" y2="196" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <line x1="138" y1="196" x2="148" y2="196" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="128" cy="196" r="4" fill="#22d3ee"/>
</svg>
